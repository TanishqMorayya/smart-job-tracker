spring.application.name=job-tracker
server.port=8080

# Database (password comes from the DB_PASSWORD environment variable)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_tracker}
spring.datasource.username=${DB_USERNAME:jobtracker}
spring.datasource.password=${DB_PASSWORD}

# JPA: Hibernate only VALIDATES the schema, it never changes it. Flyway owns the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator: expose only health
management.endpoints.web.exposure.include=health

# JWT (secret comes from the JWT_SECRET environment variable)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS: frontend origin(s), comma separated
app.cors.allowed-origins=http://localhost:5180
